<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alkhidmat App - Deep Link Testing</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans antialiased flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-lg border border-gray-100 p-6 sm:p-8 text-center">
        <div class="inline-block bg-emerald-50 text-emerald-700 text-[10px] font-bold uppercase tracking-widest px-3 py-1 rounded-full mb-4">
            Local Custom Scheme Testing
        </div>

        <h1 class="text-xl font-extrabold text-gray-900 mb-2">App Deep Link Testing</h1>
        <p class="text-xs text-gray-500 mb-6">Click below to open specific screens in your iOS simulator.</p>

        <div class="space-y-3">
            <a href="alkhidmatpk://home" 
               class="block w-full bg-[#0060ae] hover:bg-[#004d8c] text-white font-bold py-3.5 px-4 rounded-xl shadow-sm text-sm text-center">
                Open App (Home Screen)
            </a>

            <a href="alkhidmatpk://about" 
               class="block w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3.5 px-4 rounded-xl shadow-sm text-sm text-center">
                Open App (About Screen)
            </a>
        </div>

        <div class="mt-8 pt-4 border-t border-gray-100 text-[11px] text-gray-400">
            Make sure you built the app fresh after adding Info.plist config.
        </div>
    </div>

</html>
